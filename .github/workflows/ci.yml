name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated vocabulary is up to date
        run: npm run vocab:check
      - name: Edge Function shared code is up to date
        run: npm run shared:check
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --ci
      - name: Database schema and RLS tests
        run: npm run test:db
      - name: Edge Function (Deno) typecheck and tests
        run: npm run test:edge
